<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 1024 1024">
  <title>Randevu eye-clock logo (light)</title>
  <g fill="none" stroke="#6C63D9" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer eye -->
    <path d="M 118 512
             C 226 367, 383 292, 512 292
             C 641 292, 798 367, 906 512
             C 798 657, 641 732, 512 732
             C 383 732, 226 657, 118 512 Z"/>
    <!-- Inner eyelid -->
    <path d="M 184 512
             C 278 398, 402 344, 512 344
             C 622 344, 746 398, 840 512
             C 746 626, 622 680, 512 680
             C 402 680, 278 626, 184 512 Z"/>

    <!-- Clock face / pupil -->
    <circle cx="512" cy="512" r="132"/>

    <!-- Clock hands, approximately 10:10 -->
    <path d="M 512 512 L 456 454"/>
    <path d="M 512 512 L 568 454"/>

    <!-- Minimal 4 ticks -->
    <path d="M 512 398 L 512 414"/>
    <path d="M 626 512 L 610 512"/>
    <path d="M 512 626 L 512 610"/>
    <path d="M 398 512 L 414 512"/>
  </g>
</svg>
